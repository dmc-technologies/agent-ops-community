name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Windows runners cost twice the Linux rate. A pull request runs the Windows job only when it
  # changes what that job installs or tests; main pushes, the nightly run, and manual runs always
  # run it. Any detector doubt (a failed step or an empty diff) runs the Windows job.
  windows-paths:
    name: Select Windows verification
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The pull-request checkout is the merge commit; its first parent is the base.
          git rev-parse --verify HEAD^2 > /dev/null
          # Both sides of a rename, raw (unquoted) path bytes, and a file instead of a pipe, so
          # grep -q stopping early can never read as "no match" under pipefail.
          changed="$(mktemp)"
          git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD > "$changed"
          cat "$changed"
          pattern='^(pyproject\.toml$|src/|examples/|tests/(conftest\.py|test_verify\.py|test_deployment_windows\.py|test_deployment_registry\.py|test_skill_installer\.py)$|\.github/workflows/ci\.yml$)'
          if [ ! -s "$changed" ] || grep -qE "$pattern" "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: ruff check .
      - run: pytest

  test-windows:
    needs: windows-paths
    if: ${{ !cancelled() && needs.windows-paths.outputs.run != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: ruff check .
      - run: pytest tests/test_verify.py
      - run: pytest tests/test_deployment_windows.py
      - run: >-
          pytest tests/test_deployment_registry.py::test_receipt_records_preserve_mixed_registry_fingerprints
      - run: >-
          pytest tests/test_skill_installer.py
          -k "humanlayer_show_me_installs_adapted_skill_with_ownership or humanlayer_show_me_updates_only_unchanged_managed_copy or show_me_windows_path_transaction_installs_and_updates or show_me_windows_transaction_refuses_replaced_skills_root or show_me_windows_transaction_refuses_replaced_fingerprinted_child or windows_directory_pin_compares_file_identity_across_mapped_aliases or native_windows_directory_pin_blocks_sibling_replacement or native_windows_mapped_alias_uses_file_identity_and_lock or native_windows_install_does_not_require_final_path_diagnostic"
      - run: agentops verify examples/local-smoke.yaml --json

  ci:
    name: CI
    if: ${{ always() }}
    needs: [windows-paths, test, test-windows]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every selected verification job
        shell: python
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = json.loads(os.environ["NEEDS"])
          expected = ['windows-paths', 'test', 'test-windows']
          if set(results) != set(expected):
              raise SystemExit("CI refused: required job evidence is missing or unexpected")
          windows = results["windows-paths"].get("outputs", {}).get("run")
          if windows not in {"true", "false"}:
              raise SystemExit("CI refused: Windows selection is missing or invalid")
          for job in expected:
              state = results[job].get("result")
              if job == "test-windows" and windows == "false" and state == "skipped":
                  continue
              if state != "success":
                  raise SystemExit(f"CI refused: {job} finished as {state}")
          print(f"CI passed: examined {len(expected)} required job results")
