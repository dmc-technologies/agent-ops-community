name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: ruff check .
      - run: pytest
      - run: agentops harness check .

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: ruff check .
      - run: pytest tests/test_verify.py
      - run: pytest tests/test_deployment_windows.py
      - run: >-
          pytest tests/test_deployment_registry.py::test_receipt_records_preserve_mixed_registry_fingerprints
      - run: >-
          pytest tests/test_skill_installer.py
          -k "humanlayer_show_me_installs_adapted_skill_with_ownership or humanlayer_show_me_updates_only_unchanged_managed_copy or show_me_windows_path_transaction_installs_and_updates or show_me_windows_transaction_refuses_replaced_skills_root or show_me_windows_transaction_refuses_replaced_fingerprinted_child or windows_directory_pin_compares_file_identity_across_mapped_aliases or native_windows_directory_pin_blocks_sibling_replacement or native_windows_mapped_alias_uses_file_identity_and_lock or native_windows_install_does_not_require_final_path_diagnostic"
      - run: agentops verify examples/local-smoke.yaml --json
      - run: agentops harness check .
