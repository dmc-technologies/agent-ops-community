# One check, run in every DMC repository by the organization ruleset "PR proof",
# that refuses a pull request whose description does not show a person the
# result. The rules it reads are in configs/global/AGENTS.md, "Pull requests and
# reviews". Each repository lists the paths a person runs or sees in
# .github/person-facing; the target branch's copy governs. The check also ties
# the GitHub label `critical`, which CodeRabbit or a person applies, to an
# approving review from a person, and refuses a missing label on a change the
# rule makes critical.
name: PR proof

# This workflow runs only when a repository's caller calls it, and declares no
# permissions of its own: a called workflow cannot ask for more than its caller
# grants, so the caller's `permissions` block is the whole grant.
on:
  workflow_call:
    inputs:
      person_facing:
        description: Ignored. The list now lives in .github/person-facing on the target branch; the input remains so existing callers keep working until they are removed.
        type: string
        default: ""
    # The dmc-agent-reader app's ID and key. Its token requests the critical review: GitHub refuses the built-in token's request for a team.
    secrets:
      PR_PROOF_APP_ID:
        required: false
      PR_PROOF_APP_KEY:
        required: false

jobs:
  proof:
    name: proof
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.PR_PROOF_APP_ID != '' }}
    # Bounds the wait while every refusal waits on a check still running on the head. No concurrency group: a cancelled run of a required check blocks the merge.
    timeout-minutes: 60
    steps:
      - name: Install the Markdown parser the check reads the description with
        run: python3 -m pip install --quiet "markdown-it-py==4.2.0"
      # A caller that does not pass the secrets keeps the built-in token, and PR proof prints the request for an agent to run.
      - name: Get the token PR proof requests the critical review with
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PR_PROOF_APP_ID }}
          private-key: ${{ secrets.PR_PROOF_APP_KEY }}
          permission-pull-requests: write
          permission-members: read
      # On a merge-group commit the script checks the queued pull request's own PR proof result instead of the description.
      - name: Read the pull request description, files, and commits
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Refuse a pull request description that does not show a person the result.

          The hosted `PR proof` check runs this file in every DMC repository from
          `.github/workflows/pr-proof.yml` in agent-ops, which carries it byte for byte. A test
          refuses drift, and `pr-proof --embed <workflow>` writes the copy. Run the same rules
          locally before `gh pr create` and before every description edit:

              scripts/pr-proof --local body.md [--base origin/HEAD] [--draft] [--label critical]

          CodeRabbit applies the tier label (`routine`, `moderate`, or `critical`) from its review; a
          person may add `critical` by hand. The hosted check reads the labels, the reviews, and the
          label history; the local preflight cannot see reviews, so it skips the approval rule.

          The local run reads the branch's own changes with Git, from the merge base with
          `--base`. It prints the exact refusals the hosted check would print. Without `--local`
          the script runs the hosted check and reads the pull request from the environment.
          The rules are in configs/global/AGENTS.md, "Pull requests and reviews".
          """

          import fnmatch
          import json
          import os
          import re
          import subprocess
          import sys
          import time

          HEADINGS = ("What problem this solves", "User impact", "Why this change was made", "Evidence", "Excluded")
          ATTACHMENT = r"https://github\.com/user-attachments/assets/[0-9A-Za-z-]+"
          EXEMPT_AUTHORS = ("dependabot[bot]", "renovate[bot]")
          PATHS_FILE = ".github/person-facing"
          LABEL = "critical"
          APPROVAL_REFUSAL = f"a '{LABEL}' pull request needs an approving review"
          AGENTS_FILE = ".github/agent-accounts"
          DEFAULT_AGENTS = ("dmc-agents",)
          # PR proof asks this team for the critical approval; any member who did not write the pull request may give it.
          REVIEW_TEAM = "dmc-developers"
          # Repositories where CodeRabbit's Critical and Major findings and failed pre-merge checks block the merge.
          STRICT_REVIEW = tuple(f"dmc-technologies/{name}" for name in (
              "momentum", "momentum-utilities", "momentum-dev-ops", "structures-utilities", "momentum-documents", "momentum-divergent", "momentum-community",
              "agent-ops", "agent-ops-community", "agent-knowledge", "business-ops", "openclaw-setup", "coderabbit",
              "govslack-relay", "llm-ops", ".github",
          ))
          # CodeRabbit review rounds each tier label allows; after the last one the author changes no code for CodeRabbit.
          TIER_ROUNDS = {"routine": 1, "moderate": 2, "critical": 2}
          # The author's one comment that lists what CodeRabbit left open once the rounds are used up.
          LEFTOVER = re.compile(r"^\W*what's left", re.I)
          CODERABBIT = "coderabbitai[bot]"
          AGENTS_MD = "AGENTS.md"
          POLICY_SOURCE = "dmc-technologies/agent-ops/configs/global/review-policy.md"
