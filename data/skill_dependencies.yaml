- id: trailofbits
  name: Trail of Bits Skills
  repo: https://github.com/trailofbits/skills.git
  ref: 293fb74c3151cceda32a85a545fe8acd67f8f5c6
  version: "2026.08.21"
  license: CC-BY-SA-4.0
  install:
    codex:
      strategy: copy-named-skills
      source: plugins
      destination: skills
      skills: &trailofbits_skills
        - gh-cli
        - git-cleanup
        - mutation-testing
        - property-based-testing
        - sarif-parsing
        - second-opinion
        - sharp-edges
        - supply-chain-risk-auditor
    opencode:
      strategy: copy-named-skills
      source: plugins
      destination: skills
      skills: *trailofbits_skills

