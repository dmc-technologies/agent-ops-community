- id: gstack
  name: GStack
  repo: https://github.com/garrytan/gstack.git
  ref: 74895062fb8a3acbf9f66cd088a83359aaaa56cd
  version: "1.32.0.0"
  license: MIT
  install:
    codex:
      strategy: gstack
      destination: skills/gstack
    claude-code:
      strategy: gstack
      destination: skills/gstack
    opencode:
      strategy: gstack
      destination: skills/gstack
    prime-agent:
      strategy: prime-gstack
      destination: .
    portable:
      strategy: copy-repo
      destination: dependencies/gstack
- id: superpowers
