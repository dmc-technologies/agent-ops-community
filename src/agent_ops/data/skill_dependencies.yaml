- id: humanlayer
  name: HumanLayer Skills
  repo: https://github.com/humanlayer/skills.git
  ref: 4d8d644ca747517973f58d7953f58d7cd07520cd
  version: "1.0.0"
  license: MIT
  # Upstream promotes five plugins in .claude-plugin/marketplace.json. show-me
  # is installed by the humanlayer-show-me entry, whose adapter adapts the skill
  # body and pins this same commit in code (show_me_adapter.PINNED_REF); the
  # other four install as ordinary named skills. Both entries track one commit,
  # so a refresh fetches one checkout of this repository.
  install:
    claude-code:
      strategy: copy-named-skills
      source: plugins
      destination: skills
      skills: &humanlayer_skills
        - build-iterated-agentic-loop
        - design-control-loop
        - improve-claude-md
        - narrow-react-prop-types
    codex:
      strategy: copy-named-skills
      source: plugins
      destination: skills
      skills: *humanlayer_skills

