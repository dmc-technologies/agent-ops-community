- id: mattpocock
  name: Matt Pocock Engineering Skills
  repo: https://github.com/mattpocock/skills.git
  ref: 3cca18b368ae95cdbdebbff572ccafa662551015
  version: "2026.09.04"
  license: MIT
  # Upstream promotes 25 skills in .claude-plugin/plugin.json. All are declared
  # except code-review, whose name collides with the Claude Code built-in skill
  # of the same name; an installed copy would shadow it. It is excluded for
  # every framework so the frameworks stay identical.
  install:
    claude-code:
      strategy: copy-named-skills
      source: skills
      destination: skills
      skills: &mattpocock_skills
        - ask-matt
        - codebase-design
        - diagnosing-bugs
        - domain-modeling
        - grill-me
        - grill-with-docs
        - grilling
        - handoff
        - implement
        - improve-codebase-architecture
        - prototype
        - research
        - resolving-merge-conflicts
        - setup-matt-pocock-skills
        - tdd
        - teach
        - to-questionnaire
        - to-spec
        - to-tickets
        - triage
        - wait-what
        - wayfinder
        - wizard
        - writing-for-agents
    codex:
      strategy: copy-named-skills
      source: skills
      destination: skills
      skills: *mattpocock_skills
    opencode:
      strategy: copy-named-skills
      source: skills
      destination: skills
      skills: *mattpocock_skills
