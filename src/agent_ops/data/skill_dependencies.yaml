      source: plugins/show-me/skills
      destination: skills
    opencode:
      strategy: humanlayer-show-me
      source: plugins/show-me/skills
      destination: skills
    prime-agent:
      strategy: humanlayer-show-me
      source: plugins/show-me/skills
